# Cargo workspace at the repo root so editors (rust-analyzer) and `cargo` work from here.
[workspace]
resolver = "2"
members = ["sim/crates/sim-core", "sim/crates/sim-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Pinned on purpose. Upgrade these in their own change, not alongside features.
rapier3d = "=0.23.1"
bevy = "=0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.23"
sim-core = { path = "sim/crates/sim-core" }

# Physics needs to be fast even in debug builds; our own code stays debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
