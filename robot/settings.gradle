rootProject.name = 'ftc-sim-robot'

// sdk:      the FTC SDK API surface (com.qualcomm.*, org.firstinspires.*), backed by the simulator
// runner:   connects to the simulator, discovers OpModes, runs them like the Robot Controller app
// TeamCode: your OpModes, same package and layout as in an FTC Robot Controller project
include 'sdk', 'runner', 'TeamCode'
